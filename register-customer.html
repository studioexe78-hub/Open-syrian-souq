<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل حساب زبون | السوق السوري المفتوح</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="container">
            <div class="logo">
                <h1>السوق السوري المفتوح</h1>
            </div>
            <nav class="nav-links">
                <a href="index.html" class="btn-login">الرئيسية</a>
            </nav>
        </div>
    </header>

    <div class="form-wrapper">
        <div class="form-container">
            <div class="form-header">
                <span class="form-icon">🛍️</span>
                <h2>إنشاء حساب زبون جديد</h2>
                <p>سجل مجاناً لتتمكن من التواصل مع البائعين وحفظ إعلاناتك المفضلة</p>
            </div>

            <form id="customer-register-form">
                
                <div class="input-group">
                    <label for="fullname">الاسم الكامل</label>
                    <input type="text" id="fullname" placeholder="مثال: أحمد محمد" required>
                </div>

                <div class="input-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="example@mail.com" required>
                </div>

                <div class="input-group">
                    <label for="city">المحافظة</label>
                    <select id="city" required>
                        <option value="" disabled selected>اختر محافظتك</option>
                        <option value="دمشق">دمشق</option>
                        <option value="ريف دمشق">ريف دمشق</option>
                        <option value="حلب">حلب</option>
                        <option value="حمص">حمص</option>
                        <option value="حماة">حماة</option>
                        <option value="اللاذقية">اللاذقية</option>
                        <option value="طرطوس">طرطوس</option>
                        <option value="السويداء">السويداء</option>
                        <option value="درعا">درعا</option>
                        <option value="القنيطرة">القنيطرة</option>
                        <option value="دير الزور">دير الزور</option>
                        <option value="الحسكة">الحسكة</option>
                        <option value="الرقة">الرقة</option>
                        <option value="إدلب">إدلب</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="password">كلمة السر</label>
                    <input type="password" id="password" placeholder="لا تقل عن 6 خانات" required>
                </div>

                <button type="submit" class="btn btn-customer btn-block">تأكيد إنشاء الحساب</button>
                
                <p class="form-footer-text">لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
            </form>
        </div>
    </div>

</body>
</html>
