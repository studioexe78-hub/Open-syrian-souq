<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل حساب بائع | السوق السوري المفتوح</title>
    <!-- ربط ملف الستايل الأساسي المشترك -->
    <link rel="stylesheet" href="style.css">
    <!-- استدعاء خط جوجل -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- شريط علوي مبسط للرجوع -->
    <header class="navbar">
        <div class="container">
            <div class="logo">
                <h1>السوق السوري المفتوح</h1>
            </div>
            <nav class="nav-links">
                <a href="index.html" class="btn-login">الرئيسية</a>
            </nav>
        </div>
    </header>

    <!-- حاوي الفورم (Form Wrapper) -->
    <div class="form-wrapper">
        <div class="form-container">
            <div class="form-header">
                <span class="form-icon">🏪</span>
                <h2>إنشاء حساب بائع جديد</h2>
                <p>افتح متجرك الافتراضي الآن، وابدأ بعرض منتجاتك وخدماتك مجاناً</p>
            </div>

            <!-- نموذج تسجيل التاجر -->
            <form id="vendor-register-form">
                
                <!-- حقل اسم التاجر -->
                <div class="input-group">
                    <label for="vendor-name">الاسم الكامل (صاحب الحساب)</label>
                    <input type="text" id="vendor-name" placeholder="مثال: محمد السوري" required>
                </div>

                <!-- حقل اسم المتجر / المصلحة -->
                <div class="input-group">
                    <label for="shop-name">اسم المحل / المصلحة التجاري</label>
                    <input type="text" id="shop-name" placeholder="مثال: شركة البركة، أو محل الفخامة" required>
                </div>

                <!-- حقل رقم الموبايل أو الواتساب (مهم جداً للتواصل المباشر) -->
                <div class="input-group">
                    <label for="phone">رقم الموبايل أو الواتساب</label>
                    <input type="tel" id="phone" placeholder="مثال: 0912345678" style="direction: ltr; text-align: right;" required>
                </div>

                <!-- حقل المحافظة (لتحديد موقع المحل للزباين) -->
                <div class="input-group">
                    <label for="vendor-city">المحافظة / موقع المحل الرئيسي</label>
                    <select id="vendor-city" required>
                        <option value="" disabled selected>اختر المحافظة</option>
                        <option value="دمشق">دمشق</option>
                        <option value="ريف دمشق">ريف دمشق</option>
                        <option value="حلب">حلب</option>
                        <option value="حمص">حمص</option>
                        <option value="حماة">حماة</option>
                        <option value="اللاذقية">اللاذقية</option>
                        <option value="طرطوس">طرطوس</option>
                        <option value="السويداء">السويداء</option>
                        <option value="درعا">درعا</option>
                        <option value="القنيطرة">القنيطرة</option>
                        <option value="دير الزور">دير الزور</option>
                        <option value="الحسكة">الحسكة</option>
                        <option value="الرقة">الرقة</option>
                        <option value="إدلب">إدلب</option>
                    </select>
                </div>

                <!-- حقل كلمة السر -->
                <div class="input-group">
                    <label for="vendor-password">كلمة السر الحساب</label>
                    <input type="password" id="vendor-password" placeholder="لا تقل عن 6 خانات" required>
                </div>

                <!-- زر الإرسال المميز باللون البرتقالي الخاص بالبائعين -->
                <button type="submit" class="btn btn-vendor btn-block">تأكيد فتح المتجر</button>
                
                <p class="form-footer-text">لديك حساب متجر بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
            </form>
        </div>
    </div>
    <script type="module" src="vendor-auth.js"></script>
</body>
</html>
